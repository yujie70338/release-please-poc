name: POC Release Please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: 執行 Release Please 工具
        id: release
        uses: googleapis/release-please-action@v4
        with:
          manifest-file: .release-please-manifest.json
          config-file: release-please-config.json

      - name: 產出 POC 版本定版證據檔案
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        run: |
          {
            echo "=== POC 版本定版證據 ==="
            echo "觸發時間: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "本次發布的專案路徑: ${{ steps.release.outputs.paths_released }}"
            echo "App A 最新版本: ${{ steps.release.outputs['images/app-a--version'] }}"
            echo "App B 最新版本: ${{ steps.release.outputs['images/app-b--version'] }}"
            echo "========================"
          } > poc_evidence.txt
          cat poc_evidence.txt

      - name: 上傳 POC 證據至 GitHub Artifacts
        if: ${{ steps.release.outputs.releases_created == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence
          path: poc_evidence.txt
