name: Nx Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Configure Git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Version, tag, and create GitHub Releases
        run: npx nx release version --git-tag --git-push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate POC release evidence
        if: ${{ success() }}
        run: |
          git fetch --tags
          {
            echo "=== POC Nx Release evidence ==="
            echo "Trigger time: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
            echo "App A latest tag: $(git tag --list 'app-a-v*' --sort=-version:refname | head -n 1)"
            echo "App B latest tag: $(git tag --list 'app-b-v*' --sort=-version:refname | head -n 1)"
            echo "All release tags:"
            git tag --list 'app-*-v*' --sort=version:refname
            echo "=============================="
          } > poc_evidence.txt
          cat poc_evidence.txt

      - name: Upload POC evidence
        if: ${{ success() }}
        uses: actions/upload-artifact@v4
        with:
          name: nx-release-evidence
          path: poc_evidence.txt
